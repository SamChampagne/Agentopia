name: Agentopia - validation Windows
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verifier:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --global bun@1.3.14
      - run: bun install --frozen-lockfile
        working-directory: tui
      - run: npm run test:ci
      - name: Vérifier la version du tag
        if: startsWith(github.ref, 'refs/tags/agentopia-')
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.TAG !== 'agentopia-' + require('./package.json').version) process.exit(1)"
      - name: Construire le téléchargement Windows
        if: startsWith(github.ref, 'refs/tags/agentopia-') || github.event_name == 'workflow_dispatch'
        id: paquet
        shell: pwsh
        env:
          AGENTOPIA_SIGN_CERT_PFX_BASE64: ${{ secrets.AGENTOPIA_SIGN_CERT_PFX_BASE64 }}
          AGENTOPIA_SIGN_CERT_PASSWORD: ${{ secrets.AGENTOPIA_SIGN_CERT_PASSWORD }}
          AGENTOPIA_SIGN_TIMESTAMP_URL: ${{ vars.AGENTOPIA_SIGN_TIMESTAMP_URL }}
          AGENTOPIA_REQUIRE_SIGNATURE: ${{ vars.AGENTOPIA_REQUIRE_SIGNATURE }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatAgentopia = $null
          $pfxAgentopia = Join-Path $env:RUNNER_TEMP ('agentopia-signature-' + [Guid]::NewGuid().ToString('N') + '.pfx')
          try {
            if ($env:AGENTOPIA_SIGN_CERT_PFX_BASE64) {
              [IO.File]::WriteAllBytes($pfxAgentopia, [Convert]::FromBase64String($env:AGENTOPIA_SIGN_CERT_PFX_BASE64))
              $motDePasseAgentopia = ConvertTo-SecureString $env:AGENTOPIA_SIGN_CERT_PASSWORD -AsPlainText -Force
              $certificatAgentopia = @(Import-PfxCertificate -FilePath $pfxAgentopia -CertStoreLocation Cert:\CurrentUser\My -Password $motDePasseAgentopia | Where-Object HasPrivateKey)
              if ($certificatAgentopia.Count -ne 1) { throw 'Un seul certificat de signature avec clé privée est requis.' }
              $env:AGENTOPIA_SIGN_CERT_THUMBPRINT = $certificatAgentopia[0].Thumbprint
              $env:AGENTOPIA_REQUIRE_SIGNATURE = '1'
            }
            Remove-Item Env:AGENTOPIA_SIGN_CERT_PFX_BASE64,Env:AGENTOPIA_SIGN_CERT_PASSWORD -ErrorAction SilentlyContinue
            if (Test-Path -LiteralPath $pfxAgentopia) { Remove-Item -LiteralPath $pfxAgentopia -Force }
            npm run package:windows
            if ($LASTEXITCODE -ne 0) { throw 'Construction ou signature échouée.' }
          } finally {
            if (Test-Path -LiteralPath $pfxAgentopia) { Remove-Item -LiteralPath $pfxAgentopia -Force }
            foreach ($certificat in $certificatAgentopia) {
              if ($certificat.Thumbprint -match '^[A-Fa-f0-9]{40}$') { Remove-Item -LiteralPath ('Cert:\CurrentUser\My\' + $certificat.Thumbprint) -Force }
            }
          }
          $paquet = Get-ChildItem releases -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'Agentopia-Setup.exe') } | Sort-Object Name -Descending | Select-Object -First 1
          "dossier=$($paquet.FullName)" >> $env:GITHUB_OUTPUT
      - name: Installer, mettre à jour, réparer et revenir en arrière sur Windows
        if: steps.paquet.outcome == 'success'
        run: node test-installation-windows.mjs "${{ steps.paquet.outputs.dossier }}"
      - name: Vérifier le téléchargement et les erreurs du nouvel installateur
        if: steps.paquet.outcome == 'success'
        run: node test-telechargement-windows.mjs "${{ steps.paquet.outputs.dossier }}"
      - uses: actions/upload-artifact@v4
        if: steps.paquet.outcome == 'success'
        with:
          name: agentopia-windows
          retention-days: 7
          if-no-files-found: error
          path: |
            releases/*/Agentopia-Setup.exe
            releases/*/Agentopia-Windows-x64.zip
            releases/*/agentopia-release.json
            releases/*/SHA256SUMS.txt
            releases/*/signature.json
  publier-beta:
    needs: verifier
    if: startsWith(github.ref, 'refs/tags/agentopia-') && contains(github.ref, '-beta.')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: agentopia-windows
          path: paquets
      - name: Publier la bêta vérifiée
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --prerelease --latest=false --title "Agentopia ${TAG#agentopia-}" --notes-file docs/beta-1.4.md paquets/*/Agentopia-Setup.exe paquets/*/Agentopia-Windows-x64.zip paquets/*/agentopia-release.json paquets/*/SHA256SUMS.txt paquets/*/signature.json
