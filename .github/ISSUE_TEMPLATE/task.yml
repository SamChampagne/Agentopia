name: Tâche
description: Définir un changement et ses critères d'acceptation
labels: [enhancement]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objectif et périmètre
      description: Besoin concret, dépendances et limites.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critères d'acceptation
      description: Résultats vérifiables et validations nécessaires.
    validations:
      required: true
